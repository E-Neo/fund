[workspace]
members = ["."]
resolver = "2"
exclude = ["crates/fund-strategies"]

[package]
name = "fund"
version = "0.1.0"
authors = ["E-Neo <e-neo@qq.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ssr"]
ssr = [
    "dep:axum",
    "dep:leptos_axum",
    "dep:tower-http",
    "dep:tokio",
    "dep:reqwest",
    "dep:scraper",
    "dep:sqlx",
    "dep:wasmtime",
    "dep:wasmtime-wasi",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
hydrate = ["leptos/hydrate"]
csr = ["leptos/csr"]

[dependencies]
axum = { version = "0.8", optional = true }
chrono = { version = "0.4", features = ["serde"] }
console_error_panic_hook = "0.1"
leptos = "0.8.20"
leptos_axum = { version = "0.8.10", optional = true }
leptos_meta = "0.8.6"
leptos_router = "0.8.15"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"], optional = true }
scraper = { version = "0.27", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono"], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "io-util", "sync"], optional = true }
toml = "1.1.4"
tower-http = { version = "0.6", features = ["fs"], optional = true }
wasm-bindgen = "=0.2.127"
wasmtime = { version = "48.0.1", features = ["component-model"], optional = true }
wasmtime-wasi = { version = "48.0.1", optional = true }
