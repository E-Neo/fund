[package]
name = "fund"
version = "0.1.0"
authors = ["E-Neo <e-neo@qq.com>"]
edition = "2024"

[[bin]]
name = "fund"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
fund-api = { path = "crates/fund-api" }
fund-types = { path = "crates/fund-types" }
http = "1"
include_dir = "0.7"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "io-util", "sync"] }
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
serde_json = "1"

[workspace]
members = [".", "crates/fund-api", "crates/fund-ui"]
default-members = [".", "crates/fund-api"]
resolver = "3"
exclude = ["crates/fund-strategies"]
