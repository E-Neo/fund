[package]
name = "fund-ui"
version = "0.1.0"
authors = ["E-Neo <e-neo@qq.com>"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["csr"]
csr = ["leptos/csr"]

[dependencies]
console_error_panic_hook = "0.1"
fund-types = { path = "../fund-types" }
js-sys = "0.3"
leptos = "0.8.20"
leptos_router = "0.8.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "DomRect",
    "Element",
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "Window",
] }
