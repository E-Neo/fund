[workspace]
members = ["dip-take-profit", "dollar-cost-averaging"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["E-Neo <e-neo@qq.com>"]
edition = "2024"

[workspace.dependencies]
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.61.1"

[profile.release]
panic = "abort"
opt-level = "s"
