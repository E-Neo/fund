[package]
name = "fund-api"
version = "0.1.0"
authors = ["E-Neo <e-neo@qq.com>"]
edition = "2024"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
fund-types = { path = "../fund-types" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "io-util", "sync"] }
toml = "1.1.5"
wasmtime = { version = "48.0.1", features = ["component-model"] }
wasmtime-wasi = "48.0.1"
